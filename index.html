<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重返白浪島｜斥候挑戰谷 E-PASS</title>

  <script>
    window.addEventListener("error", function (event) {
      var box = document.getElementById("system-status");
      if (box) {
        box.className = "error";
        box.innerText =
          "JavaScript 發生錯誤：\n" +
          event.message + "\n" +
          "檔案：" + event.filename + "\n" +
          "行數：" + event.lineno + "，欄位：" + event.colno;
      }
    });

    window.addEventListener("unhandledrejection", function (event) {
      var box = document.getElementById("system-status");
      if (box) {
        box.className = "error";
        box.innerText = "JavaScript Promise 錯誤：\n" + event.reason;
      }
    });
  </script>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f4f4;
      color: #111;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.4;
    }

    h2 {
      margin: 4px 0 16px;
      font-size: 1rem;
      font-weight: 500;
      color: #444;
    }

    .panel {
      width: 100%;
      max-width: 980px;
      margin: 0 auto 12px;
      padding: 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      text-align: left;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #fff;
    }

    code {
      display: inline-block;
      padding: 2px 4px;
      border-radius: 4px;
      background: #eee;
      font-size: 0.85em;
    }

    #message,
    #system-status {
      width: 100%;
      max-width: 980px;
      min-height: 42px;
      margin: 12px auto;
      padding: 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 1rem;
      line-height: 1.5;
      text-align: center;
      white-space: pre-line;
    }

    #system-status {
      min-height: auto;
      margin-top: 0;
      font-size: 0.9rem;
      color: #555;
      text-align: left;
    }

    .success {
      color: #087f23 !important;
      border-color: #b7dfb9 !important;
      background: #f3fbf3 !important;
    }

    .error {
      color: #b00020 !important;
      border-color: #f1b7bd !important;
      background: #fff5f6 !important;
    }

    #map-container {
      position: relative;
      width: 100%;
      max-width: 980px;
      margin: auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }

    #base-map {
      width: 100%;
      display: block;
    }

    .pass-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      pointer-events: none;
    }

    .pass-layer.active { display: block; }

    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px auto;
    }

    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #scan-button { background: #2f80ed; }
    #manual-button { background: #555; }
    #reset-button { background: #eb5757; }
    #export-button { background: #333; }

    #qr-reader {
      width: 100%;
      max-width: 360px;
      margin: 12px auto;
      background: #fff;
    }

    .manual-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .manual-row input {
      flex: 1;
      min-width: 220px;
    }

    .score-board {
      width: 100%;
      max-width: 980px;
      margin: 12px auto;
      padding: 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      text-align: left;
    }

    .score-board h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }

    .score-card {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .score-card strong { font-size: 1.1rem; }

    .hint {
      width: 100%;
      max-width: 980px;
      margin: 8px auto 0;
      color: #666;
      font-size: 0.85rem;
      line-height: 1.5;
      text-align: left;
    }

    @media (max-width: 640px) {
      body { padding: 10px; }
      .control-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <h1>重返白浪島｜斥候挑戰谷</h1>
  <h2>E-PASS 闖關計分卡</h2>

  <section class="panel" aria-label="隊伍資料">
    <div class="control-grid">
      <div>
        <label for="division">分營</label>
        <select id="division">
          <option value="智">智</option>
          <option value="仁">仁</option>
          <option value="勇">勇</option>
          <option value="愛">愛</option>
        </select>
      </div>

      <div>
        <label for="group">分團</label>
        <select id="group">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </div>

      <div>
        <label for="squad">小隊</label>
        <select id="squad">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
      </div>
    </div>
  </section>

  <div id="system-status">系統初始化中。如果這行一直沒有改變，代表 JavaScript 沒有成功執行。</div>
  <div id="message">請先選擇分營、分團、小隊，再掃描關卡 QR Code。</div>

  <div id="map-container">
    <img src="img/闖關卡-底圖.jpg" id="base-map" alt="闖關卡底圖" />
  </div>

  <div class="button-row">
    <button id="scan-button" type="button">📷 掃描 QR Code</button>
    <button id="export-button" type="button">⬇️ 匯出本機紀錄 CSV</button>
    <button id="reset-button" type="button">清除本機進度</button>
  </div>

  <div id="qr-reader"></div>

  <section class="panel" aria-label="手動測試 QR Code">
    <label for="manual-code">手動測試 QR Code 內容</label>
    <div class="manual-row">
      <input id="manual-code" type="text" placeholder="例如：mission01-10 或 mission01-5" />
      <button id="manual-button" type="button">送出測試</button>
    </div>
  </section>

  <section class="score-board" aria-label="本機計分紀錄">
    <h3>本機即時計分</h3>
    <div id="score-grid" class="score-grid"></div>
  </section>

  <p class="hint">
    QR Code 內容建議格式：<br />
    10 點紅色 QR：<code>目前網址?code=mission01&points=10</code><br />
    5 點藍色 QR：<code>目前網址?code=mission01&points=5</code><br />
    本頁也支援純文字格式：<code>mission01-10</code>、<code>mission01-5</code>、<code>mission01|10</code>、<code>mission01|5</code>。<br />
    圖片檔名格式：<code>1雙索渡河-10.png</code>、<code>1雙索渡河-5.png</code>。
  </p>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiBeL0lKEq8_XQVdvEdiylGxiwdS1_AoGn3S4PuOgWn5EkhksYSBqk5_hjsEadMgX_DQ/exec";
      var EVENT_NAME = "重返白浪島｜斥候挑戰谷";
      var LOCAL_COMPLETED_KEY = "completedMissionScoresV3";
      var LOCAL_RECORDS_KEY = "scanRecordsV3";
      var LOCAL_TEAM_KEY = "selectedTeam";

      var missions = {
        mission01: { no: "01", code: "mission01", name: "雙索渡河" },
        mission02: { no: "02", code: "mission02", name: "古玩競技" },
        mission03: { no: "03", code: "mission03", name: "套索越谷" },
        mission04: { no: "04", code: "mission04", name: "救援前線" },
        mission05: { no: "05", code: "mission05", name: "定向追蹤" },
        mission06: { no: "06", code: "mission06", name: "空投補給" },
        mission07: { no: "07", code: "mission07", name: "雨水蒐集" },
        mission08: { no: "08", code: "mission08", name: "信號發射" },
        mission09: { no: "09", code: "mission09", name: "山林野釣" },
        mission10: { no: "10", code: "mission10", name: "洗石淘沙" },
        mission11: { no: "11", code: "mission11", name: "水源淨化" },
        mission12: { no: "12", code: "mission12", name: "野染工事" },
        mission13: { no: "13", code: "mission13", name: "鑽木取火" },
        mission14: { no: "14", code: "mission14", name: "投石射箭" },
        mission15: { no: "15", code: "mission15", name: "黑夜行軍" },
        mission16: { no: "16", code: "mission16", name: "潛行偵察" }
      };

      var completed = {};
      var localRecords = [];
      var scanner = null;

      var systemStatus = document.getElementById("system-status");
      var messageBox = document.getElementById("message");
      var mapContainer = document.getElementById("map-container");
      var scoreGrid = document.getElementById("score-grid");
      var scanButton = document.getElementById("scan-button");
      var exportButton = document.getElementById("export-button");
      var resetButton = document.getElementById("reset-button");
      var manualButton = document.getElementById("manual-button");
      var manualInput = document.getElementById("manual-code");

      init();

      function init() {
        initPassLayers();
        restoreState();
        bindEvents();
        renderCompletedLayers();
        renderScoreBoard();
        handleUrlScanIfNeeded();
        updateSystemStatus();
      }

      function updateSystemStatus() {
        var scannerLoaded = typeof Html5Qrcode !== "undefined";
        var cameraSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
        var secure = window.isSecureContext;
        var protocol = window.location.protocol;

        systemStatus.className = scannerLoaded && cameraSupported && secure ? "success" : "error";
        systemStatus.innerText = [
          "系統狀態：JavaScript 已成功啟動",
          "目前網址協定：" + protocol,
          "QR 掃描套件：" + (scannerLoaded ? "已載入" : "未載入，請確認網路可連到 unpkg.com"),
          "瀏覽器相機支援：" + (cameraSupported ? "支援" : "不支援"),
          "相機安全環境：" + (secure ? "符合" : "不符合，請使用 https:// 或 localhost"),
          "本地端防重複：已啟用。同一分營／分團／小隊掃同一關同分數時，不會重複送出。"
        ].join("\n");
      }

      function bindEvents() {
        scanButton.addEventListener("click", startScanner);
        exportButton.addEventListener("click", downloadLocalCsv);
        resetButton.addEventListener("click", resetProgress);
        manualButton.addEventListener("click", submitManualCode);

        manualInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") submitManualCode();
        });

        ["division", "group", "squad"].forEach(function (id) {
          document.getElementById(id).addEventListener("change", function () {
            saveSelectedTeam();
            renderCompletedLayers();
            renderScoreBoard();
          });
        });
      }

      function initPassLayers() {
        Object.keys(missions).forEach(function (key) {
          var mission = missions[key];

          [10, 5].forEach(function (points) {
            var img = document.createElement("img");
            img.className = "pass-layer";
            img.id = "pass-" + mission.code + "-" + points;
            img.alt = mission.no + " " + mission.name + " " + points + "點通關標記";
            img.src = "img/" + Number(mission.no) + mission.name + "-" + points + ".png";
            mapContainer.appendChild(img);
          });
        });
      }

      function restoreState() {
        try {
          completed = JSON.parse(localStorage.getItem(LOCAL_COMPLETED_KEY) || "{}");
        } catch (error) {
          completed = {};
        }

        try {
          localRecords = JSON.parse(localStorage.getItem(LOCAL_RECORDS_KEY) || "[]");
        } catch (error) {
          localRecords = [];
        }

        try {
          var savedTeam = JSON.parse(localStorage.getItem(LOCAL_TEAM_KEY) || "null");
          if (savedTeam) {
            if (savedTeam.division) document.getElementById("division").value = savedTeam.division;
            if (savedTeam.group) document.getElementById("group").value = savedTeam.group;
            if (savedTeam.squad) document.getElementById("squad").value = savedTeam.squad;
          }
        } catch (error) {}
      }

      function saveSelectedTeam() {
        localStorage.setItem(LOCAL_TEAM_KEY, JSON.stringify(getSelectedTeam()));
      }

      function getSelectedTeam() {
        var division = document.getElementById("division").value;
        var group = document.getElementById("group").value;
        var squad = document.getElementById("squad").value;

        return {
          division: division,
          group: group,
          squad: squad,
          teamKey: division + "-" + group + "-" + squad
        };
      }

      function buildScanKey(teamKey, missionCode) {
        return teamKey + "|" + missionCode;
      }

      function handleUrlScanIfNeeded() {
        var urlParams = new URLSearchParams(window.location.search);
        var code = urlParams.get("code");
        var points = urlParams.get("points");
        if (code && points) handleScanResult(window.location.href);
      }

      async function startScanner() {
        var qrRegion = document.getElementById("qr-reader");
        qrRegion.innerHTML = "";
        updateSystemStatus();

        if (typeof Html5Qrcode === "undefined") {
          showMessage("error", "無法載入 QR Code 掃描套件。請確認網路可以連到 https://unpkg.com/html5-qrcode，或先使用手動測試欄位。");
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showMessage("error", "這個瀏覽器不支援相機掃描。請改用 Chrome / Safari，或使用手動測試欄位。");
          return;
        }

        if (!window.isSecureContext) {
          showMessage("error", "相機需要 HTTPS 或 localhost 才能啟動。手機若開 http://192.168.x.x 通常不能用相機，請改部署到 GitHub Pages / Netlify 等 HTTPS 網址。");
          return;
        }

        try {
          scanButton.disabled = true;
          scanButton.innerText = "相機啟動中...";

          if (scanner) {
            try { await scanner.stop(); } catch (error) {}
            try { scanner.clear(); } catch (error) {}
          }

          scanner = new Html5Qrcode("qr-reader");

          await scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            async function (decodedText) {
              handleScanResult(decodedText);

              try { await scanner.stop(); } catch (error) {}
              qrRegion.innerHTML = "";
              scanButton.disabled = false;
              scanButton.innerText = "📷 掃描 QR Code";
            },
            function () {}
          );

          showMessage("success", "相機已啟動，請將 QR Code 對準掃描框。");
        } catch (error) {
          showMessage("error", "無法啟動相機：\n" + error + "\n請確認瀏覽器已允許相機權限，且網頁是用 HTTPS 或 localhost 開啟。");
          scanButton.disabled = false;
          scanButton.innerText = "📷 掃描 QR Code";
        }
      }

      function submitManualCode() {
        var value = manualInput.value.trim();

        if (!value) {
          showMessage("error", "請先輸入 QR Code 內容，例如 mission01-10。");
          return;
        }

        handleScanResult(value);
      }

      function handleScanResult(rawText) {
        var result = parseQrPayload(rawText);

        if (!result) {
          showMessage("error", "❌ 無效的 QR Code，請確認內容包含關卡代碼與點數，例如 mission01-10。");
          return;
        }

        var mission = missions[result.code];
        var points = Number(result.points);

        if (!mission) {
          showMessage("error", "❌ 無效的關卡代碼：" + result.code);
          return;
        }

        if (![10, 5].includes(points)) {
          showMessage("error", "❌ 無效的點數：" + points + "，本次活動僅支援 10 點或 5 點。");
          return;
        }

        var team = getSelectedTeam();
        saveSelectedTeam();

        var scanKey = buildScanKey(team.teamKey, mission.code);
        var previous = completed[scanKey];

        if (previous && Number(previous.points) === points) {
          renderCompletedLayers();
          renderScoreBoard();
          showMessage(
            "error",
            "⚠️ 已掃描過，未重複送出。\n" +
            team.division + "營 " + team.group + "分團 " + team.squad + "小隊已完成「" +
            mission.name + "」" + points + " 點。"
          );
          return;
        }

        if (previous && Number(previous.points) !== points) {
          var confirmed = confirm(
            team.division + "營 " + team.group + "分團 " + team.squad + "小隊已完成「" +
            mission.name + "」" + previous.points + " 點。\n\n是否要改成 " + points + " 點？"
          );

          if (!confirmed) {
            showMessage("error", "已取消更新，沒有送出資料。");
            return;
          }
        }

        var previousPoints = previous ? previous.points : "";

        completed[scanKey] = {
          teamKey: team.teamKey,
          division: team.division,
          group: team.group,
          squad: team.squad,
          missionCode: mission.code,
          missionNo: mission.no,
          missionName: mission.name,
          points: points,
          updatedAt: new Date().toISOString()
        };

        localStorage.setItem(LOCAL_COMPLETED_KEY, JSON.stringify(completed));

        var record = buildRecord(mission, points, team, previousPoints);
        localRecords.push(record);
        localStorage.setItem(LOCAL_RECORDS_KEY, JSON.stringify(localRecords));

        renderCompletedLayers();
        renderScoreBoard();
        postToBackend(record);

        var statusText = previousPoints && Number(previousPoints) !== points
          ? "已將「" + mission.name + "」由 " + previousPoints + " 點更新為 " + points + " 點"
          : "完成「" + mission.name + "」，獲得 " + points + " 點";

        showMessage("success", "🎉 掃描成功！" + team.division + "營 " + team.group + "分團 " + team.squad + "小隊 " + statusText);
      }

      function parseQrPayload(rawText) {
        var text = String(rawText || "").trim();
        if (!text) return null;

        try {
          var url = new URL(text);
          var codeFromUrl = url.searchParams.get("code") || url.searchParams.get("mission");
          var pointsFromUrl = Number(url.searchParams.get("points") || url.searchParams.get("point") || url.searchParams.get("p"));
          if (codeFromUrl && pointsFromUrl) {
            return { code: normalizeMissionCode(codeFromUrl), points: pointsFromUrl };
          }
        } catch (error) {}

        try {
          var json = JSON.parse(text);
          if (json.code && json.points) {
            return { code: normalizeMissionCode(json.code), points: Number(json.points) };
          }
        } catch (error) {}

        var match = text.match(/^(mission\d{1,2}|\d{1,2})[-_|,\s]+(10|5)$/i);
        if (match) {
          return {
            code: normalizeMissionCode(match[1]),
            points: Number(match[2])
          };
        }

        return null;
      }

      function normalizeMissionCode(code) {
        var value = String(code || "").trim().toLowerCase();

        if (/^mission\d{1,2}$/.test(value)) {
          var number = value.replace("mission", "");
          while (number.length < 2) number = "0" + number;
          return "mission" + number;
        }

        if (/^\d{1,2}$/.test(value)) {
          while (value.length < 2) value = "0" + value;
          return "mission" + value;
        }

        return value;
      }

      function buildRecord(mission, points, team, previousPoints) {
        var now = new Date();
        var missionNumber = String(Number(mission.no));
        var stationSheetName = missionNumber + "-" + mission.name;

        return {
          eventName: EVENT_NAME,
          division: team.division,
          group: team.group,
          squad: team.squad,
          teamKey: team.teamKey,
          missionCode: mission.code,
          missionNo: mission.no,
          missionName: mission.name,
          mission: mission.name,
          region: mission.code,
          result: points === 10 ? "勝者" : "負者",
          points: Number(points),
          previousPoints: previousPoints ? Number(previousPoints) : "",
          action: previousPoints ? "update" : "create",
          sheet: stationSheetName,
          stationSheet: stationSheetName,
          timestamp: now.toISOString(),
          localTime: now.toLocaleString("zh-TW", { hour12: false })
        };
      }

      function postToBackend(record) {
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(record)
        }).catch(function (error) {
          console.warn("後台寫入失敗：", error);
        });
      }

      function renderCompletedLayers() {
        var layers = document.querySelectorAll(".pass-layer");
        var currentTeam = getSelectedTeam();

        for (var i = 0; i < layers.length; i++) {
          layers[i].classList.remove("active");
        }

        Object.keys(completed).forEach(function (key) {
          var data = completed[key];

          if (data.teamKey !== currentTeam.teamKey) return;

          var layer = document.getElementById("pass-" + data.missionCode + "-" + data.points);
          if (layer) layer.classList.add("active");
        });
      }

      function renderScoreBoard() {
        var currentTeam = getSelectedTeam();
        var total = 0;
        var entries = [];

        Object.keys(completed).forEach(function (key) {
          var item = completed[key];
          if (item.teamKey === currentTeam.teamKey) {
            total += Number(item.points || 0);
            entries.push(item);
          }
        });

        entries.sort(function (a, b) {
          return Number(a.missionNo) - Number(b.missionNo);
        });

        scoreGrid.innerHTML = "";

        var totalCard = document.createElement("div");
        totalCard.className = "score-card";
        totalCard.innerHTML = "<div>" + currentTeam.division + "營 " + currentTeam.group + "分團 " + currentTeam.squad + "小隊</div><strong>" + total + " 點</strong>";
        scoreGrid.appendChild(totalCard);

        entries.forEach(function (item) {
          var card = document.createElement("div");
          card.className = "score-card";
          card.innerHTML = "<div>" + item.missionNo + " " + item.missionName + "</div><strong>" + item.points + " 點</strong>";
          scoreGrid.appendChild(card);
        });
      }

      function showMessage(type, text) {
        messageBox.className = type || "";
        messageBox.innerText = text;
      }

      function resetProgress() {
        var confirmed = confirm("確定要清除本機進度與防重複紀錄嗎？這只會清除目前裝置的顯示紀錄，不會刪除後台試算表資料。");
        if (!confirmed) return;

        localStorage.removeItem(LOCAL_COMPLETED_KEY);
        localStorage.removeItem(LOCAL_RECORDS_KEY);

        completed = {};
        localRecords = [];

        renderCompletedLayers();
        renderScoreBoard();
        showMessage("", "已清除本機進度與防重複紀錄，請重新掃描 QR Code。");
      }

      function downloadLocalCsv() {
        if (!localRecords.length) {
          showMessage("error", "目前沒有本機掃描紀錄可以匯出。");
          return;
        }

        var headers = [
          "eventName",
          "division",
          "group",
          "squad",
          "teamKey",
          "missionCode",
          "missionNo",
          "missionName",
          "result",
          "points",
          "previousPoints",
          "action",
          "timestamp",
          "localTime"
        ];

        var rows = [headers];

        localRecords.forEach(function (record) {
          rows.push(headers.map(function (key) {
            return record[key] || "";
          }));
        });

        var csv = rows.map(function (row) {
          return row.map(escapeCsv).join(",");
        }).join("\n");

        var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");

        a.href = url;
        a.download = "闖關計分_" + new Date().toISOString().slice(0, 10) + ".csv";
        a.click();

        URL.revokeObjectURL(url);
      }

      function escapeCsv(value) {
        var text = String(value == null ? "" : value);

        if (/[",\n]/.test(text)) {
          return "\"" + text.replace(/"/g, "\"\"") + "\"";
        }

        return text;
      }
    });
  </script>
</body>
</html>
